# UC13 · A3, RF46 com RF58: liga o alerta "Conquistas" e provoca um selo novo depois da linha de base.
# Confere o interruptor ligado e a notificação na bandeja do Android. A janela de permissão
# depende da imagem do emulador (no runner do GitHub ela não aparece), por isso o toque nela é
# opcional; o que prova o RF46 é a notificação chegar na bandeja.
appId: br.unb.unicash
name: "UC13 03 - Alerta de conquista"
tags: [uc13]
env:
  DEEP_LINK: "unicash://"
  DATA_NOVO: "05/08/2026"
---
- runFlow: ../subflows/abrir-app-limpo.yaml
# Primeira avaliação: vira linha de base, sem notificação (FR-009a).
- runFlow: ../subflows/abrir-conquistas.yaml
- openLink: ${DEEP_LINK}perfil
- tapOn:
    id: "interruptor-conquistas"
- tapOn:
    text: "Allow|Permitir"
    optional: true
- assertVisible:
    id: "interruptor-conquistas"
    checked: true
- takeScreenshot: artefatos/uc13/05-alerta-conquistas-ligado
- runFlow:
    file: ../subflows/nova-receita.yaml
    env: { TITULO: "Freela", VALOR: "50,00", DATA: "${DATA_NOVO}" }
# RF46: a notificação do selo novo chega na bandeja.
- swipe:
    start: 50%, 0%
    end: 50%, 70%
- extendedWaitUntil:
    visible: "Novo selo: No verde em agosto"
    timeout: 15000
- takeScreenshot: artefatos/uc13/06-notificacao-na-bandeja
- pressKey: back
- runFlow: ../subflows/abrir-conquistas.yaml
- assertVisible: "No verde em agosto"
- takeScreenshot: artefatos/uc13/07-selo-novo-registrado
