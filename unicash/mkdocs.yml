site_name: UniCash — Gestão Financeira Pessoal
site_description: Plataforma para organização financeira de estudantes, famílias e comunidade universitária
repo_url: https://github.com/mdsreq-fga-unb/REQ-2026.2-T02-UniCash
repo_name: REQ-2026.2-T02-UniCash
edit_uri: edit/docs/unicash/docs/

theme:
  name: material
  language: pt-BR
  icon:
    repo: fontawesome/brands/github
  features:
    # Navegação
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.prune
    - toc.follow
    # Busca
    - search.highlight
    - search.suggest
    - search.share
    # Conteúdo
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view
    - announce.dismiss
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Modo claro

hooks:
  - hooks/rastreabilidade.py

plugins:
  - search:
      lang: pt
  - tags
  - blog:
      blog_dir: atas
      blog_toc: true
      post_date_format: long
      post_url_format: "{slug}"
      post_excerpt: optional
      post_readtime: true
      post_readtime_words_per_minute: 200
      archive_name: Arquivo
      archive_date_format: MMMM 'de' yyyy
      archive_url_date_format: yyyy/MM
      categories_name: Categorias
      categories_allowed:
        - Cliente
        - Equipe
        - Requisitos
      pagination_per_page: 10
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true
      draggable: true
      skip_classes:
        - sem-zoom
  - table-reader:
      data_path: docs/dados
  - charts
  - git-revision-date-localized:
      type: date
      locale: pt
      enable_creation_date: true
      enable_git_follow: false
      fallback_to_build_date: true
      exclude:
        - consulta/*
  - print-site:
      add_to_navigation: false
      print_page_title: Leitura contínua
      add_print_site_banner: false
      exclude:
        - consulta/*
        - atas/*
      add_cover_page: false
      enumerate_headings: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.blocks.caption
  - pymdownx.critic
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      auto_append:
        - includes/abreviacoes.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: vegalite
          class: vegalite
          format: !!python/name:mkdocs_charts_plugin.fences.fence_vegalite

nav:
  - Início:
      - Apresentação: index.md

  - Projeto:
      - Cenário atual: cenario.md
      - Solução proposta: solucao.md
      - Intervenção social: intervencao.md

  - Planejamento:
      - Estratégias de engenharia de software: estrategia.md
      - Engenharia de requisitos: engenharia_de_requisitos.md
      - Definition of Ready e Definition of Done: dor_dod.md
      - Requisitos:
          - Requisitos Funcionais: requisitos_funcionais.md
          - Requisitos Não Funcionais: requisitos_nao_funcionais.md
      - Escopo do MVP: mvp.md
      - Casos de uso: casos_de_uso.md
      - Cronograma e entregas: cronograma.md

  - Equipe:
      - Interação entre equipe e cliente: interacao.md
      - Registros de engenharia de requisitos:
          - atas/index.md
      - Lições aprendidas: licoes_aprendidas.md
      - Referências: referencias.md

extra:
  generator: false

extra_css:
  - stylesheets/extra.css
  - stylesheets/consulta.css
  - stylesheets/interface.css

extra_javascript:
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.number.min.js
  - https://cdn.jsdelivr.net/npm/vega@5.30.0
  - https://cdn.jsdelivr.net/npm/vega-lite@5.21.0
  - https://cdn.jsdelivr.net/npm/vega-embed@6.26.0
  - javascripts/tabelas.js
  - javascripts/catalogo.js
  - javascripts/interface.js
