name: Mobile E2E (Maestro)

# Testes ponta a ponta com Maestro, com prints e vídeo como artefatos (issue #133).
# Roda num PR só quando a label "e2e" é adicionada (outras labels e novos pushes não disparam;
# para rodar de novo, tire e recoloque a label), ou manualmente em Actions > Mobile E2E (Maestro) > Run workflow (depois que este arquivo estiver na main).
# Cada execução gasta um build Android da cota gratuita da organização sevenspecs no EAS.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch: {}

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Maestro UC13 (Android)
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Verificar EXPO_TOKEN
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Crie o secret EXPO_TOKEN em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # APK de teste com o JS embutido (perfil e2e-test do eas.json), compilado na nuvem do EAS.
      - name: Build do APK de teste (EAS)
        run: |
          eas build --platform android --profile e2e-test --non-interactive --wait --json > build.json
          url=$(node -e "const b=require('./build.json'); console.log((Array.isArray(b)?b[0]:b).artifacts.buildUrl)")
          curl -fsSL "$url" -o app.apk

      - name: Instalar Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # O runner do GitHub tem KVM; esta regra libera o acesso para o emulador.
      - name: Habilitar KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rodar fluxos no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: mobile
          script: bash .maestro/rodar-ci.sh app.apk

      - name: Publicar prints, vídeo e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-uc13
          path: |
            mobile/.maestro/artefatos/
            mobile/artefatos/
          if-no-files-found: warn
